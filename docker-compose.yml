services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pipeforge
      POSTGRES_PASSWORD: pipeforge
      POSTGRES_DB: pipeforge
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-dev-only-shared-secret-change-me}
    volumes:
      - backend-uploads:/app/uploads
    ports:
      - "8000:8000"

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://pipeforge:pipeforge@db:5432/pipeforge?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me-to-a-random-string}
      NEXTAUTH_URL: http://localhost:3000
      FASTAPI_URL: http://backend:8000
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-dev-only-shared-secret-change-me}
    ports:
      - "3000:3000"
    command: sh -c "npx prisma migrate deploy && npm start"

volumes:
  db-data:
  backend-uploads:
